name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  remix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAPVID_VIDEO_HOME: ${{ runner.temp }}/tapvid test home
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tapvid browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install locked runtime and Chromium
        run: node skills/remix/scripts/ensure-runtime.mjs
      - name: Verify reusable installation
        run: node skills/remix/scripts/ensure-runtime.mjs
      - name: Test including render and standalone installation
        run: npm run test:full
